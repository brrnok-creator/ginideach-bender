 const priorityIds=priority.map(n=>words.findIndex(w=>w.w.toLowerCase()===n)).filter(i=>i>=0);
 const other=shuffle([...Array(words.length).keys()].filter(i=>!priorityIds.includes(i)));
 deck=other.slice(0,30-priorityIds.length);
 const slots=shuffle([...Array(30).keys()]).slice(0,priorityIds.length).sort((a,b)=>a-b);

function adventureArt(n){
 if(n===100)return "story_final.webp";
 if(n>=80){const seq=["story_meditate_1.webp","story_meditate_2.webp","story_meditate_3.webp","story_meditate_4.webp","story_meditate_5.webp","story_meditate_6.webp"];return seq[(n-80)%seq.length]}
 if(n>=51){const seq=["story_travel_1.webp","story_travel_2.webp","story_travel_3.webp","story_travel_4.webp","story_travel_5.webp","story_travel_6.webp"];return seq[(n-51)%seq.length]}
 if(n===50)return "story_50.webp";
 if(n>=41)return "story_cards.webp";
 if(n===40)return "story_40.webp";
 if(n>=31)return n%2?"story_31.webp":"story_30.webp";
 if(n===30)return "story_30.webp";
 if(n>=21)return n%2?"story_21.webp":"story_20.webp";
 if(n===20)return "story_20.webp";
 if(n>=10)return n%2?"story_10.webp":"comic_party.webp";

}
function milestoneText(n){
 if(n===20)return "🍀 The leprechaun joins the party!";
 if(n===30)return "🏅 A pot of gold and a magnificent gold chain!";
 if(n===40)return "🍻 Lock-in! The whole pub celebrates!";
 if(n>=41&&n<=49)return "🃏 He keeps winning at cards!";
 if(n===50)return "✈️ Plane tickets — time to see the world!";
 if(n>=51&&n<=79)return "🌍 Dancing and drinking their way around the world!";
 if(n>=80&&n<=99)return "✨ The road to enlightenment — and the drinks keep flowing!";

}
